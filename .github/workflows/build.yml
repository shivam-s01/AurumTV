name: Build Aurum TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so the "Create Release" step can publish a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission
        run: chmod +x gradlew

      # Release signing. If the four secrets are set the APK is signed with
      # the release keystore; if any is missing the build still succeeds
      # (debug-signed) instead of failing on an empty keystore.
      - name: Decode keystore + write key.properties
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > aurum-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=aurum-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
            echo "Release keystore configured."
          else
            echo "::warning::Signing secrets missing - building with the debug key."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name "*-release.apk" | head -n 1)
          OUT="dist/AurumTV-1.1.0-b${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          ls -lh dist
          echo "path=$OUT" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurum-tv-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Check release opt-in
        id: release_gate
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[release]"* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Commit message doesn't contain [release] - APK is in the artifacts, no public release created."
          fi

      - name: Create Release
        if: steps.release_gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build${{ github.run_number }}
          name: Aurum TV ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ steps.apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
